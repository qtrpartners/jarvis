schema_version = 1
environment = "github-app-audit"
owner_source = "github.repository_owner"
owner_type = "Organization"
evidence_retention_days = 90

[apps.ci_reader]
name = "qtrpartners-jarvis-ci-reader"
app_id_variable = "JARVIS_CI_READER_APP_ID"
private_key_secret = "JARVIS_CI_READER_PRIVATE_KEY"
repository_selection = "selected"
repositories = ["jarvis"]

[apps.ci_reader.permissions]
contents = "read"
metadata = "read"

[apps.release_bot]
name = "qtrpartners-jarvis-release-bot"
app_id_variable = "JARVIS_RELEASE_BOT_APP_ID"
private_key_secret = "JARVIS_RELEASE_BOT_PRIVATE_KEY"
repository_selection = "selected"
repositories = ["jarvis-live"]

[apps.release_bot.permissions]
contents = "write"
metadata = "read"
pull_requests = "write"
